<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Thunderbolt Expenses</title>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5/build/index.umd.min.js"></script>
<style>
  :root{ --navy:#16305c; --accent:#c0392b; --floor:#eef1f6; --line:#c7cdd8; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--floor);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1b1f27;}
  body{display:flex;flex-direction:column;overflow:hidden;}

  .topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#fff;border-bottom:1px solid var(--line);}
  .topbar .t1{font-size:16px;font-weight:800;color:var(--navy);}
  .navbtn{background:none;border:none;font-size:22px;color:var(--navy);padding:4px 8px;cursor:pointer;}

  .content{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 30px;max-width:560px;margin:0 auto;width:100%;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:14.5px;font-weight:600;color:#2c3342;margin-bottom:6px;}
  .field input[type=text],.field input[type=date],.field input[type=number],.field input[type=email],
  .field select{width:100%;border:1.4px solid var(--line);border-radius:9px;
    padding:13px;font-size:16px;font-family:inherit;background:#fff;color:#1b1f27;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--navy);}
  .field.row2{display:flex;gap:10px;}
  .field.row2 > div{flex:1;}

  .claimhead{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;}

  .expcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;}
  .expcard .cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .expcard .cardhead span{font-size:12.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;}
  .expcard .rmbtn{background:#fbeeec;color:var(--accent);border:1px solid #e0b3ac;border-radius:6px;
    padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;}

  .addentry{width:100%;padding:13px;border:1.6px dashed #9aa4b8;background:#fff;color:var(--navy);
    border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:16px;}

  .totalbar{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;
    border-radius:10px;padding:13px 15px;font-size:15px;font-weight:700;margin-bottom:18px;}
  .totalbar .amt{font-size:19px;}

  .sigblock{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;}
  .sigblock label{display:block;font-size:14.5px;font-weight:600;color:#2c3342;margin-bottom:8px;}
  .sigpad-wrap{position:relative;border:1.4px solid var(--line);border-radius:9px;background:#fbfbfc;height:140px;overflow:hidden;}
  .sigpad-wrap canvas{width:100%;height:100%;touch-action:none;display:block;}
  .sigpad-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#b7bfcc;font-size:14px;pointer-events:none;}
  .sigpad-actions{display:flex;justify-content:flex-end;margin-top:8px;}
  .clearbtn{background:#fbeeec;color:var(--accent);border:1px solid #e0b3ac;border-radius:7px;
    padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}

  .receipt-row{display:flex;align-items:center;gap:8px;margin-top:2px;}
  .receipt-btn{position:relative;font-size:12px;font-weight:600;color:var(--navy);
    border:1px dashed var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .receipt-btn input[type=file]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .receipt-thumb{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .receipt-rm{flex:0 0 auto;background:none;border:none;color:var(--accent);font-size:16px;
    line-height:1;padding:3px 5px;cursor:pointer;}

  .bottomnav{flex:0 0 auto;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:#fff;border-top:1px solid var(--line);}
  .btn-primary,.btn-secondary{flex:1;padding:14px;border-radius:10px;font-weight:700;font-size:14.5px;
    border:none;cursor:pointer;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-secondary{background:#eef1f6;color:var(--navy);}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#1b1f27;
    color:#fff;padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:600;opacity:0;
    pointer-events:none;transition:opacity .25s, transform .25s;z-index:400;max-width:88vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .overlay{position:fixed;inset:0;background:#fff;z-index:300;display:none;flex-direction:column;}
  .overlay.show{display:flex;}
  .overlay-body{flex:1;overflow-y:auto;padding:16px;}
  .claimrow{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .claimrow .meta{font-size:13px;color:#5b6474;}
  .claimrow .name{font-weight:700;font-size:15px;color:var(--navy);}
  .claimrow button{flex:0 0 auto;padding:8px 12px;border-radius:7px;border:none;font-size:12.5px;font-weight:700;
    background:var(--navy);color:#fff;cursor:pointer;}
  .claimrow button.delbtn{background:#fbeeec;color:var(--accent);border:1px solid #e0b3ac;}
  .empty-msg{text-align:center;color:#8792a3;font-size:14px;margin-top:40px;}

  /* crop modal */
  .crop-modal{position:fixed;inset:0;background:rgba(10,14,20,.94);z-index:500;display:flex;
    align-items:center;justify-content:center;padding:16px;}
  .crop-modal-inner{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;}
  .crop-hint{color:#dfe3ea;font-size:13px;margin:0 0 10px;text-align:center;}
  .crop-stage{position:relative;max-width:100%;max-height:60vh;touch-action:none;line-height:0;}
  .crop-stage img{display:block;max-width:100%;max-height:60vh;user-select:none;-webkit-user-select:none;}
  .crop-rect{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);
    touch-action:none;cursor:move;}
  .crop-handle{position:absolute;width:26px;height:26px;background:#fff;border-radius:50%;
    margin:-13px;touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.4);}
  .crop-handle[data-handle="nw"]{top:0;left:0;}
  .crop-handle[data-handle="ne"]{top:0;left:100%;}
  .crop-handle[data-handle="sw"]{top:100%;left:0;}
  .crop-handle[data-handle="se"]{top:100%;left:100%;}
  .crop-actions{display:flex;gap:10px;width:100%;margin-top:16px;}
  .crop-btn{flex:1;padding:13px;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;
    border:none;cursor:pointer;}
  .crop-btn-secondary{background:#333;color:#fff;}
  .crop-btn-primary{background:var(--accent);color:#fff;}
</style>
</head>
<body>

<div class="topbar">
  <button class="navbtn" id="claimsBtn" type="button" aria-label="Saved claims">☰</button>
  <div class="t1">Thunderbolt Expenses</div>
  <button class="navbtn" id="saveClaimBtn" type="button" aria-label="Save claim" style="font-size:18px;">💾</button>
  <button class="navbtn" id="newClaimBtn" type="button" aria-label="New claim">+</button>
</div>

<div class="content">

  <div class="claimhead">
    <div class="field"><label>Employee Name</label><input type="text" id="employeeName" autocapitalize="words"></div>
    <div class="field" style="margin-bottom:0;"><label>Month</label><input type="text" id="claimMonth" placeholder="e.g. July 2026"></div>
  </div>

  <div id="expList"></div>
  <button class="addentry" id="addExpenseBtn" type="button">+ Add Expense</button>

  <div class="totalbar"><span>Total Claimed</span><span class="amt" id="claimTotal">R 0.00</span></div>

  <div class="sigblock">
    <label>Signature</label>
    <div class="sigpad-wrap">
      <canvas id="sigPad"></canvas>
      <div class="sigpad-placeholder" id="sigPlaceholder">Sign here</div>
    </div>
    <div class="sigpad-actions">
      <button type="button" class="clearbtn" id="clearSigBtn">Clear</button>
    </div>
  </div>

</div>

<div class="bottomnav">
  <button class="btn-secondary" id="downloadFormBtn" type="button">⬇ Expenses Form</button>
  <button class="btn-primary" id="downloadReceiptsBtn" type="button">⬇ Receipts</button>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="claimsOverlay">
  <div class="topbar">
    <button class="navbtn" id="closeClaimsBtn" type="button">‹</button>
    <div class="t1">Saved Claims</div>
    <div style="width:34px;"></div>
  </div>
  <div class="overlay-body" id="claimsList"></div>
</div>

<div class="crop-modal" id="cropModal" style="display:none;">
  <div class="crop-modal-inner">
    <p class="crop-hint">Drag the corners to crop, then confirm</p>
    <div class="crop-stage" id="cropStage">
      <img id="cropImg" draggable="false" alt="Receipt photo">
      <div class="crop-rect" id="cropRect">
        <div class="crop-handle" data-handle="nw"></div>
        <div class="crop-handle" data-handle="ne"></div>
        <div class="crop-handle" data-handle="sw"></div>
        <div class="crop-handle" data-handle="se"></div>
      </div>
    </div>
    <div class="crop-actions">
      <button type="button" id="cropCancelBtn" class="crop-btn crop-btn-secondary">Cancel</button>
      <button type="button" id="cropUseBtn" class="crop-btn crop-btn-primary">Use Photo</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ---------------- state ----------------
  const DRAFT_KEY = 'tb_expenses_draft_v1';
  const SAVED_LIST_KEY = 'tb_expenses_saved_v1';
  let hasStorage = true;
  try{ const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); }catch(e){ hasStorage = false; }

  function blankExpense(){
    return { date:'', client:'', reason:'', description:'', category:'', costCode:'', amount:'', receiptDataUrl:'' };
  }
  function blankState(){
    return { employeeName:'', claimMonth: defaultMonthLabel(), expenses:[ blankExpense() ], signatureDataUrl:'' };
  }
  function defaultMonthLabel(){
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const d = new Date();
    return months[d.getMonth()] + ' ' + d.getFullYear();
  }

  let state = blankState();

  function esc(v){ return (v==null?'':String(v)).replace(/"/g,'&quot;'); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function formatDate(iso){
    if(!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if(isNaN(d)) return iso;
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  // ---------------- toast ----------------
  let toastTimer = null;
  function showToast(msg, duration){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove('show'), duration || 2600);
  }

  // ---------------- draft persistence ----------------
  function saveDraft(){
    if(!hasStorage) return;
    try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); }catch(e){ console.warn('Draft save failed', e); }
  }
  let draftTimer = null;
  function scheduleDraftSave(){
    if(!hasStorage) return;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(saveDraft, 600);
  }
  function loadDraft(){
    if(!hasStorage) return null;
    try{
      const raw = localStorage.getItem(DRAFT_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function draftHasContent(s){
    return !!(s && (s.employeeName || (s.expenses||[]).some(e=> e.client || e.description || e.amount)));
  }

  // ---------------- saved claims list ----------------
  function getSavedClaims(){
    if(!hasStorage) return [];
    try{
      const raw = localStorage.getItem(SAVED_LIST_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function setSavedClaims(list){
    if(!hasStorage) return;
    try{ localStorage.setItem(SAVED_LIST_KEY, JSON.stringify(list)); }catch(e){}
  }
  function saveCurrentClaim(){
    if(!hasStorage) return;
    const list = getSavedClaims();
    const id = state.__id || ('claim_' + Date.now());
    state.__id = id;
    const idx = list.findIndex(c=> c.__id === id);
    const entry = JSON.parse(JSON.stringify(state));
    if(idx >= 0) list[idx] = entry; else list.unshift(entry);
    setSavedClaims(list);
  }
  function renderClaimsList(){
    const wrap = document.getElementById('claimsList');
    const list = getSavedClaims();
    wrap.innerHTML = '';
    if(!list.length){
      wrap.innerHTML = '<div class="empty-msg">No saved claims yet</div>';
      return;
    }
    list.forEach(c=>{
      const total = (c.expenses||[]).reduce((s,e)=>{ const v=parseFloat(e.amount); return s + (isNaN(v)?0:v); }, 0);
      const row = document.createElement('div');
      row.className = 'claimrow';
      row.innerHTML =
        '<div><div class="name">'+esc(c.employeeName||'(no name)')+' — '+esc(c.claimMonth||'')+'</div>' +
        '<div class="meta">'+(c.expenses||[]).length+' expense(s) · R '+total.toFixed(2)+'</div></div>' +
        '<div style="display:flex;gap:6px;">' +
          '<button type="button" data-load="'+esc(c.__id)+'">Open</button>' +
          '<button type="button" class="delbtn" data-del="'+esc(c.__id)+'">Delete</button>' +
        '</div>';
      wrap.appendChild(row);
    });
    wrap.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(!confirm('Delete this saved claim? This can\'t be undone.')) return;
        const list = getSavedClaims().filter(c=> c.__id !== btn.dataset.del);
        setSavedClaims(list);
        renderClaimsList();
        showToast('Claim deleted');
      });
    });
    wrap.querySelectorAll('[data-load]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const list = getSavedClaims();
        const found = list.find(c=> c.__id === btn.dataset.load);
        if(found){
          state = JSON.parse(JSON.stringify(found));
          renderAll();
          saveDraft();
          closeClaimsOverlay();
          showToast('Loaded claim');
        }
      });
    });
  }
  function openClaimsOverlay(){ renderClaimsList(); document.getElementById('claimsOverlay').classList.add('show'); }
  function closeClaimsOverlay(){ document.getElementById('claimsOverlay').classList.remove('show'); }
  document.getElementById('claimsBtn').addEventListener('click', openClaimsOverlay);
  document.getElementById('closeClaimsBtn').addEventListener('click', closeClaimsOverlay);
  document.getElementById('newClaimBtn').addEventListener('click', ()=>{
    if(draftHasContent(state) && !confirm('Start a new claim? Save the current one first from the ☰ menu if you want to keep it.')) return;
    state = blankState();
    renderAll();
    saveDraft();
    showToast('New claim started');
  });

  // ---------------- header fields ----------------
  const employeeInput = document.getElementById('employeeName');
  const monthInput = document.getElementById('claimMonth');
  employeeInput.addEventListener('input', ()=>{ state.employeeName = employeeInput.value; scheduleDraftSave(); });
  monthInput.addEventListener('input', ()=>{ state.claimMonth = monthInput.value; scheduleDraftSave(); });

  // ---------------- signature pad ----------------
  (function setupSignaturePad(){
    const canvas = document.getElementById('sigPad');
    const placeholder = document.getElementById('sigPlaceholder');
    const ctx = canvas.getContext('2d');
    let drawing = false, hasInk = false, lastX = 0, lastY = 0;

    function resize(){
      const rect = canvas.parentElement.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      const prevData = hasInk ? canvas.toDataURL() : null;
      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(ratio, ratio);
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#1b1f27';
      if(prevData){
        const img = new Image();
        img.onload = ()=> ctx.drawImage(img, 0, 0, rect.width, rect.height);
        img.src = prevData;
      }
    }
    window.addEventListener('resize', resize);
    resize();

    function pos(e){
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }
    canvas.addEventListener('pointerdown', (e)=>{
      drawing = true;
      hasInk = true;
      placeholder.style.display = 'none';
      const p = pos(e);
      lastX = p.x; lastY = p.y;
      if(canvas.setPointerCapture){ try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
    });
    canvas.addEventListener('pointermove', (e)=>{
      if(!drawing) return;
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lastX = p.x; lastY = p.y;
    });
    function endStroke(){
      if(!drawing) return;
      drawing = false;
      state.signatureDataUrl = canvas.toDataURL('image/png');
      scheduleDraftSave();
    }
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);

    document.getElementById('clearSigBtn').addEventListener('click', ()=>{
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasInk = false;
      placeholder.style.display = 'flex';
      state.signatureDataUrl = '';
      scheduleDraftSave();
    });

    window.__loadSignatureFromState = function(){
      if(state.signatureDataUrl){
        hasInk = true;
        placeholder.style.display = 'none';
        const img = new Image();
        img.onload = ()=>{
          const rect = canvas.parentElement.getBoundingClientRect();
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, rect.width, rect.height);
        };
        img.src = state.signatureDataUrl;
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasInk = false;
        placeholder.style.display = 'flex';
      }
    };
  })();

  document.getElementById('saveClaimBtn').addEventListener('click', ()=>{
    saveCurrentClaim();
    showToast('Claim saved');
  });

  // ---------------- expense list ----------------
  const expListEl = document.getElementById('expList');

  function expenseCardHtml(exp, i){
    return '<div class="expcard" data-card="'+i+'">' +
      '<div class="cardhead"><span>Expense ' + (i+1) + '</span>' +
      (state.expenses.length > 1 ? '<button class="rmbtn" type="button" data-rm="'+i+'">Remove</button>' : '') +
      '</div>' +
      '<div class="field"><label>Date</label><input type="date" data-i="'+i+'" data-k="date" value="'+esc(exp.date)+'"></div>' +
      '<div class="field"><label>Client</label><input type="text" data-i="'+i+'" data-k="client" value="'+esc(exp.client)+'"></div>' +
      '<div class="field"><label>Reason for Visit</label><input type="text" data-i="'+i+'" data-k="reason" value="'+esc(exp.reason)+'"></div>' +
      '<div class="field"><label>Description</label><input type="text" data-i="'+i+'" data-k="description" value="'+esc(exp.description)+'"></div>' +
      '<div class="field"><label>Installation / Warranty / SLA?</label>' +
        '<select data-i="'+i+'" data-k="category">' +
          '<option value=""'+(exp.category===''?' selected':'')+'>—</option>' +
          '<option value="Installation"'+(exp.category==='Installation'?' selected':'')+'>Installation</option>' +
          '<option value="Warranty"'+(exp.category==='Warranty'?' selected':'')+'>Warranty</option>' +
          '<option value="SLA"'+(exp.category==='SLA'?' selected':'')+'>SLA</option>' +
        '</select></div>' +
      '<div class="field row2">' +
        '<div><label>Cost Code</label><input type="text" data-i="'+i+'" data-k="costCode" value="'+esc(exp.costCode)+'"></div>' +
        '<div><label>Amount (R)</label><input type="number" inputmode="decimal" step="0.01" data-i="'+i+'" data-k="amount" value="'+esc(exp.amount)+'"></div>' +
      '</div>' +
      '<div class="receipt-row">' +
        '<label class="receipt-btn">\ud83d\udcf7 ' + (exp.receiptDataUrl ? 'Change receipt' : 'Add receipt') +
          '<input type="file" accept="image/*" capture="environment" class="receipt-input" data-i="'+i+'"></label>' +
        (exp.receiptDataUrl ?
          '<img class="receipt-thumb" src="'+exp.receiptDataUrl+'">' +
          '<button type="button" class="receipt-rm" data-i="'+i+'" aria-label="Remove receipt">\u2715</button>'
          : '') +
      '</div>' +
    '</div>';
  }

  function renderExpenses(){
    expListEl.innerHTML = state.expenses.map(expenseCardHtml).join('');

    expListEl.querySelectorAll('input[data-k], select[data-k]').forEach(el=>{
      el.addEventListener('input', ()=>{
        const i = +el.dataset.i, k = el.dataset.k;
        state.expenses[i][k] = el.value;
        recalcTotal();
        scheduleDraftSave();
      });
      el.addEventListener('change', ()=>{
        const i = +el.dataset.i, k = el.dataset.k;
        state.expenses[i][k] = el.value;
        recalcTotal();
        scheduleDraftSave();
      });
    });
    expListEl.querySelectorAll('[data-rm]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.expenses.splice(+btn.dataset.rm, 1);
        renderExpenses();
        recalcTotal();
        scheduleDraftSave();
      });
    });
    expListEl.querySelectorAll('.receipt-input').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const file = inp.files && inp.files[0];
        if(!file) return;
        const i = +inp.dataset.i;
        const label = inp.closest('.receipt-btn');
        try{
          const rawDataUrl = await readFileAsDataUrl(file);
          if(label) label.textContent = 'Crop the photo\u2026';
          const croppedDataUrl = await openReceiptCropper(rawDataUrl);
          if(state.expenses[i]){
            state.expenses[i].receiptDataUrl = croppedDataUrl;
            renderExpenses();
            scheduleDraftSave();
          }
        }catch(err){
          if(!err || err.message !== 'cancelled'){
            console.warn('Receipt photo failed:', err);
            showToast('Could not attach that photo — try again', 3500);
          }
          renderExpenses();
        }
      });
    });
    expListEl.querySelectorAll('.receipt-rm').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = +btn.dataset.i;
        if(state.expenses[i]){
          state.expenses[i].receiptDataUrl = '';
          renderExpenses();
          scheduleDraftSave();
        }
      });
    });
  }

  function recalcTotal(){
    let sum = 0;
    state.expenses.forEach(e=>{
      const v = parseFloat(e.amount);
      if(!isNaN(v)) sum += v;
    });
    document.getElementById('claimTotal').textContent = 'R ' + sum.toFixed(2);
    return sum;
  }

  document.getElementById('addExpenseBtn').addEventListener('click', ()=>{
    state.expenses.push(blankExpense());
    renderExpenses();
    recalcTotal();
    scheduleDraftSave();
    const cards = expListEl.querySelectorAll('.expcard');
    if(cards.length) cards[cards.length-1].scrollIntoView({behavior:'smooth', block:'start'});
  });

  function renderAll(){
    employeeInput.value = state.employeeName || '';
    monthInput.value = state.claimMonth || '';
    renderExpenses();
    recalcTotal();
    if(window.__loadSignatureFromState) window.__loadSignatureFromState();
  }

  // ---------------- receipt photo helpers ----------------
  function readFileAsDataUrl(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=> reject(new Error('Could not read the photo'));
      reader.onload = ()=> resolve(reader.result);
      reader.readAsDataURL(file);
    });
  }

  // ---------------- receipt photo crop tool ----------------
  const openReceiptCropper = (function setupReceiptCrop(){
    const modal = document.getElementById('cropModal');
    const stage = document.getElementById('cropStage');
    const imgEl = document.getElementById('cropImg');
    const rectEl = document.getElementById('cropRect');
    const cancelBtn = document.getElementById('cropCancelBtn');
    const useBtn = document.getElementById('cropUseBtn');

    let pendingResolve = null, pendingReject = null;
    let rect = {x:0, y:0, w:0, h:0};
    let dragMode = null, dragStart = null;

    function applyRect(){
      rectEl.style.left = rect.x + 'px';
      rectEl.style.top = rect.y + 'px';
      rectEl.style.width = rect.w + 'px';
      rectEl.style.height = rect.h + 'px';
    }
    function clampRect(){
      const iw = imgEl.clientWidth, ih = imgEl.clientHeight;
      const minSize = 40;
      rect.w = Math.max(minSize, Math.min(rect.w, iw));
      rect.h = Math.max(minSize, Math.min(rect.h, ih));
      rect.x = Math.max(0, Math.min(rect.x, iw - rect.w));
      rect.y = Math.max(0, Math.min(rect.y, ih - rect.h));
    }
    function startDrag(e, mode){
      e.preventDefault();
      e.stopPropagation();
      dragMode = mode;
      dragStart = { x: e.clientX, y: e.clientY, rect: Object.assign({}, rect) };
      if(e.target.setPointerCapture){ try{ e.target.setPointerCapture(e.pointerId); }catch(err){} }
    }
    rectEl.addEventListener('pointerdown', (e)=> startDrag(e, 'move'));
    rectEl.querySelectorAll('.crop-handle').forEach(h=>{
      h.addEventListener('pointerdown', (e)=> startDrag(e, h.dataset.handle));
    });
    stage.addEventListener('pointermove', (e)=>{
      if(!dragMode) return;
      e.preventDefault();
      const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
      let r = Object.assign({}, dragStart.rect);
      if(dragMode === 'move'){
        r.x += dx; r.y += dy;
      } else {
        if(dragMode.indexOf('w') !== -1){ r.x += dx; r.w -= dx; }
        if(dragMode.indexOf('e') !== -1){ r.w += dx; }
        if(dragMode.indexOf('n') !== -1){ r.y += dy; r.h -= dy; }
        if(dragMode.indexOf('s') !== -1){ r.h += dy; }
      }
      rect = r;
      clampRect();
      applyRect();
    });
    window.addEventListener('pointerup', ()=>{ dragMode = null; });

    function finish(dataUrlOrNull, isCancel){
      modal.style.display = 'none';
      if(isCancel){ if(pendingReject) pendingReject(new Error('cancelled')); }
      else { if(pendingResolve) pendingResolve(dataUrlOrNull); }
      pendingResolve = null; pendingReject = null;
    }
    cancelBtn.addEventListener('click', ()=> finish(null, true));
    useBtn.addEventListener('click', ()=>{
      const iw = imgEl.clientWidth, ih = imgEl.clientHeight;
      const scaleX = imgEl.naturalWidth / iw, scaleY = imgEl.naturalHeight / ih;
      const sx = rect.x * scaleX, sy = rect.y * scaleY;
      const sw = rect.w * scaleX, sh = rect.h * scaleY;
      const maxDim = 1600;
      let destW = sw, destH = sh;
      if(destW > maxDim || destH > maxDim){
        if(destW >= destH){ destH = Math.round(destH * (maxDim / destW)); destW = maxDim; }
        else { destW = Math.round(destW * (maxDim / destH)); destH = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(destW));
      canvas.height = Math.max(1, Math.round(destH));
      canvas.getContext('2d').drawImage(imgEl, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      finish(canvas.toDataURL('image/jpeg', 0.88), false);
    });

    return function openReceiptCropper(dataUrl){
      return new Promise((resolve, reject)=>{
        pendingResolve = resolve;
        pendingReject = reject;
        modal.style.display = 'flex';
        imgEl.onload = ()=>{
          requestAnimationFrame(()=>{
            const iw = imgEl.clientWidth, ih = imgEl.clientHeight;
            const w = iw * 0.82, h = ih * 0.82;
            rect = { x:(iw - w)/2, y:(ih - h)/2, w, h };
            applyRect();
          });
        };
        imgEl.src = dataUrl;
      });
    };
  })();

  // ---------------- Word document builders ----------------
  // Builds a genuine .docx from scratch using docx.js (real paragraphs/tables/
  // images, not HTML repackaged as Word) — avoids the "unreadable content" /
  // "alternate formats" errors that the HTML-based trick could trigger.
  function dataUrlToImageBytes(dataUrl){
    const match = /^data:image\/(\w+);base64,(.*)$/.exec(dataUrl || '');
    if(!match) return null;
    let type = match[1].toLowerCase();
    if(type === 'jpeg') type = 'jpg';
    const binary = atob(match[2]);
    const bytes = new Uint8Array(binary.length);
    for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return { data: bytes, type: type };
  }
  function getImageNaturalSize(dataUrl){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=> resolve({ w: img.naturalWidth || 400, h: img.naturalHeight || 300 });
      img.onerror = ()=> resolve({ w: 400, h: 300 });
      img.src = dataUrl;
    });
  }

  async function buildFormDocxBlob(){
    const D = window.docx;
    if(!D) throw new Error('Word export library failed to load — check your internet connection and reload the page.');
    const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, BorderStyle, AlignmentType, HeightRule, VerticalAlign, ImageRun } = D;

    // A4 (11906 twips wide) minus 900-twip margins on each side
    const USABLE_WIDTH = 11906 - 900 - 900;
    function dxa(pct){ return Math.round(USABLE_WIDTH * pct / 100); }

    const border = { style: BorderStyle.SINGLE, size: 4, color: '000000' };
    const borders = { top: border, bottom: border, left: border, right: border };

    function cell(text, opts){
      opts = opts || {};
      return new TableCell({
        width: { size: dxa(opts.width != null ? opts.width : 14), type: WidthType.DXA },
        shading: opts.shade ? { fill: opts.shade } : undefined,
        borders: borders,
        margins: { top: 60, bottom: 60, left: 80, right: 80 },
        children: [ new Paragraph({
          alignment: opts.align || AlignmentType.LEFT,
          children: [ new TextRun({ text: text || '', bold: !!opts.bold, size: opts.size || 18 }) ]
        })]
      });
    }

    const headerColPct = [16, 52, 12, 20];
    const headerTable = new Table({
      width: { size: USABLE_WIDTH, type: WidthType.DXA },
      columnWidths: headerColPct.map(dxa),
      rows: [ new TableRow({ children: [
        cell('Employee Name:', {bold:true, width:16}),
        cell(state.employeeName || '', {width:52}),
        cell('Month:', {bold:true, width:12}),
        cell(state.claimMonth || '', {width:20})
      ]})]
    });

    const expenseColPct = [13, 14, 18, 21, 15, 8, 11];
    const headerRow = new TableRow({ children: [
      cell('Date', {bold:true, align:AlignmentType.CENTER, shade:'EEF1F6', width:13}),
      cell('Client', {bold:true, align:AlignmentType.CENTER, shade:'EEF1F6', width:14}),
      cell('Reason for Visit', {bold:true, align:AlignmentType.CENTER, shade:'EEF1F6', width:18}),
      cell('Description', {bold:true, align:AlignmentType.CENTER, shade:'EEF1F6', width:21}),
      cell('Installation/ Warranty/ SLA?', {bold:true, align:AlignmentType.CENTER, shade:'EEF1F6', width:15}),
      cell('Cost Code', {bold:true, align:AlignmentType.CENTER, shade:'EEF1F6', width:8}),
      cell('Amount', {bold:true, align:AlignmentType.CENTER, shade:'EEF1F6', width:11})
    ]});

    const dataRows = [];
    let total = 0, rowCount = 0, receiptCount = 0;
    state.expenses.forEach(e=>{
      const v = parseFloat(e.amount);
      const hasAny = e.client || e.description || e.reason || (!isNaN(v) && v !== 0) || e.receiptDataUrl;
      if(!hasAny) return;
      if(!isNaN(v)) total += v;
      rowCount++;
      let descText = e.description || '';
      if(e.receiptDataUrl){ receiptCount++; descText += ' [Receipt #' + receiptCount + ']'; }
      dataRows.push(new TableRow({ children: [
        cell(formatDate(e.date), {align:AlignmentType.CENTER, width:13}),
        cell(e.client || '', {width:14}),
        cell(e.reason || '', {width:18}),
        cell(descText, {width:21}),
        cell(e.category || '', {align:AlignmentType.CENTER, width:15}),
        cell(e.costCode || '', {align:AlignmentType.CENTER, width:8}),
        cell(!isNaN(v) ? v.toFixed(2) : '', {align:AlignmentType.CENTER, width:11})
      ]}));
    });
    const MIN_ROWS = 15;
    for(let i = rowCount; i < MIN_ROWS; i++){
      dataRows.push(new TableRow({ children: [
        cell('',{width:13}), cell('',{width:14}), cell('',{width:18}), cell('',{width:21}),
        cell('',{width:15}), cell('',{width:8}), cell('',{width:11})
      ]}));
    }

    const expenseTable = new Table({
      width: { size: USABLE_WIDTH, type: WidthType.DXA },
      columnWidths: expenseColPct.map(dxa),
      rows: [headerRow, ...dataRows]
    });

    function signCell(text, opts){
      opts = opts || {};
      const paraChildren = opts.image
        ? [ opts.image ]
        : [ new TextRun({ text: text || '', bold: !!opts.bold, size: opts.size || 18 }) ];
      return new TableCell({
        width: { size: dxa(opts.width != null ? opts.width : 14), type: WidthType.DXA },
        borders: borders,
        margins: { top: 100, bottom: 500, left: 80, right: 80 },
        verticalAlign: VerticalAlign.TOP,
        children: [ new Paragraph({ children: paraChildren }) ]
      });
    }

    // embed the digitally-captured signature, if there is one — otherwise the
    // cell stays blank for a pen signature after printing, same as before
    let sigImageRun = null;
    if(state.signatureDataUrl){
      const imgBytes = dataUrlToImageBytes(state.signatureDataUrl);
      if(imgBytes){
        const sz = await getImageNaturalSize(state.signatureDataUrl);
        const targetW = 140;
        const targetH = Math.max(20, Math.round(targetW * (sz.h / sz.w)));
        sigImageRun = new ImageRun({ data: imgBytes.data, type: imgBytes.type, transformation:{width:targetW, height:targetH} });
      }
    }

    const signColPct = [13, 27, 15, 23, 9, 13];
    const sigTable = new Table({
      width: { size: USABLE_WIDTH, type: WidthType.DXA },
      columnWidths: signColPct.map(dxa),
      rows: [ new TableRow({
        height: { value: 700, rule: HeightRule.ATLEAST },
        children:[
          signCell('Signature:', {bold:true, width:13}),
          signCell('', {width:27, image: sigImageRun}),
          signCell('Approved By:', {bold:true, width:15}),
          signCell('', {width:23}),
          signCell('Date:', {bold:true, width:9}),
          signCell('', {width:13})
        ]})]});

    const officeTable = new Table({
      width: { size: USABLE_WIDTH, type: WidthType.DXA },
      columnWidths: signColPct.map(dxa),
      rows: [ new TableRow({
        height: { value: 700, rule: HeightRule.ATLEAST },
        children:[
          signCell('EFT No.:', {bold:true, width:13}),
          signCell('', {width:27}),
          signCell('Amount Paid:', {bold:true, width:15}),
          signCell('', {width:23}),
          signCell('Date Paid:', {bold:true, width:9}),
          signCell('', {width:13})
        ]})]});

    const doc = new Document({ sections: [{
      properties: {
        page: {
          size: { width: 11906, height: 16838 }, // A4 in twips
          margin: { top: 900, bottom: 900, left: 900, right: 900 }
        }
      },
      children: [
        new Paragraph({ alignment: AlignmentType.CENTER,
          children: [ new TextRun({ text:'Thunderbolt', bold:true, italics:true, size:40 }) ] }),
        new Paragraph({ alignment: AlignmentType.CENTER,
          children: [ new TextRun({ text:'Thunderbolt Expense Reimbursement Form', bold:true, underline:{}, size:24 }) ],
          spacing: { after: 200 } }),
        headerTable,
        new Paragraph({ text:'', spacing:{after:100} }),
        expenseTable,
        new Paragraph({ alignment: AlignmentType.RIGHT,
          children: [ new TextRun({ text:'TOTAL CLAIMED: R ' + total.toFixed(2), bold:true, size:22 }) ],
          spacing: { before:200, after:300 } }),
        sigTable,
        new Paragraph({ alignment: AlignmentType.CENTER,
          children: [ new TextRun({ text:'FOR OFFICE USE ONLY', bold:true, underline:{}, size:22 }) ],
          spacing: { before:300, after:200 } }),
        officeTable
      ]
    }]});

    return Packer.toBlob(doc);
  }

  async function buildReceiptsDocxBlob(){
    const D = window.docx;
    if(!D) throw new Error('Word export library failed to load — check your internet connection and reload the page.');
    const { Document, Packer, Paragraph, TextRun, ImageRun, AlignmentType } = D;

    const receiptEntries = state.expenses.filter(e=> e.receiptDataUrl);
    if(!receiptEntries.length) return null;

    const sizes = await Promise.all(receiptEntries.map(e=> getImageNaturalSize(e.receiptDataUrl)));

    const children = [
      new Paragraph({ alignment: AlignmentType.CENTER,
        children: [ new TextRun({ text:'Thunderbolt', bold:true, italics:true, size:36 }) ] }),
      new Paragraph({ alignment: AlignmentType.CENTER,
        children: [ new TextRun({ text:'Expense Receipts', bold:true, underline:{}, size:22 }) ],
        spacing: { after: 100 } }),
      new Paragraph({ alignment: AlignmentType.CENTER,
        children: [ new TextRun({ text: (state.employeeName||'') + (state.claimMonth ? ' — ' + state.claimMonth : ''), size:18 }) ],
        spacing: { after: 300 } })
    ];

    receiptEntries.forEach((e, idx)=>{
      const n = idx + 1;
      const v = parseFloat(e.amount);
      const caption = 'Receipt #' + n + ' — ' + (e.client ? e.client + ' — ' : '') + (e.description || 'Expense') + ' (R ' + (!isNaN(v)?v.toFixed(2):'0.00') + ')';
      children.push(new Paragraph({
        children: [ new TextRun({ text: caption, bold:true, size:18 }) ],
        spacing: { before:200, after:100 }
      }));
      const imgBytes = dataUrlToImageBytes(e.receiptDataUrl);
      if(imgBytes){
        const { w, h } = sizes[idx];
        const targetW = 420;
        const targetH = Math.round(targetW * (h / w));
        children.push(new Paragraph({
          children: [ new ImageRun({ data: imgBytes.data, type: imgBytes.type, transformation: { width: targetW, height: targetH } }) ],
          spacing: { after: 200 }
        }));
      }
    });

    const doc = new Document({ sections: [{
      properties: {
        page: {
          size: { width: 11906, height: 16838 },
          margin: { top: 900, bottom: 900, left: 900, right: 900 }
        }
      },
      children
    }]});
    return Packer.toBlob(doc);
  }

  function slugify(s){
    return (s||'').trim().replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  }
  function buildFormFilename(){
    const parts = ['Expenses', slugify(state.employeeName) || null, slugify(state.claimMonth) || null].filter(Boolean);
    return parts.join('_') + '.docx';
  }
  function buildReceiptsFilename(){
    const parts = ['Receipts', slugify(state.employeeName) || null, slugify(state.claimMonth) || null].filter(Boolean);
    return parts.join('_') + '.docx';
  }

  function downloadBlob(blob, filename, preOpenedTab){
    try{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      if(preOpenedTab && !preOpenedTab.closed){
        // Word docs can't be viewed inline in a browser tab like a PDF can —
        // navigating the tab to the blob would trigger a second, duplicate
        // download with a random filename. Just close it instead.
        preOpenedTab.close();
      }
      setTimeout(()=> URL.revokeObjectURL(url), 60000);
    }catch(err){
      console.error('Download failed:', err);
      if(preOpenedTab && !preOpenedTab.closed){
        preOpenedTab.document.write('<body style="font-family:sans-serif;padding:24px;color:#333;">Could not prepare the file. Please try again.</body>');
      }
    }
  }

  async function shareOrDownload(btn, buildBlobFn, buildFilenameFn, title){
    const preOpenedTab = window.open('', '_blank');
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Preparing\u2026';
    try{
      const blob = await buildBlobFn();
      if(!blob){
        if(preOpenedTab && !preOpenedTab.closed) preOpenedTab.close();
        showToast('No receipts attached yet');
        return;
      }
      const filename = buildFilenameFn();
      const file = new File([blob], filename, {type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        if(preOpenedTab && !preOpenedTab.closed) preOpenedTab.close();
        try{
          await navigator.share({ files:[file], title: title, text: title });
          showToast('Shared');
        }catch(e){
          if(e && e.name !== 'AbortError'){
            const fallbackTab = window.open('', '_blank');
            downloadBlob(blob, filename, fallbackTab);
            showToast('Downloaded — check your Downloads folder or notifications', 4000);
          }
        }
      } else {
        downloadBlob(blob, filename, preOpenedTab);
        showToast('Downloaded — check your Downloads folder or notifications', 4000);
      }
    }catch(err){
      console.error(title + ' failed:', err);
      if(preOpenedTab && !preOpenedTab.closed) preOpenedTab.close();
      showToast('Could not prepare the file: ' + (err && err.message ? err.message : 'unknown error'), 4500);
    }finally{
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  }

  document.getElementById('downloadFormBtn').addEventListener('click', function(){
    saveCurrentClaim();
    shareOrDownload(this, buildFormDocxBlob, buildFormFilename, 'Thunderbolt Expenses Form');
  });
  document.getElementById('downloadReceiptsBtn').addEventListener('click', function(){
    shareOrDownload(this, buildReceiptsDocxBlob, buildReceiptsFilename, 'Thunderbolt Expense Receipts');
  });

  // ---------------- startup ----------------
  const draft = loadDraft();
  if(draftHasContent(draft)){
    if(confirm('Resume your unfinished expense claim from last time?')){
      state = draft;
    } else {
      state = blankState();
      saveDraft();
    }
  } else if(draft){
    state = draft;
  }
  renderAll();
})();
</script>
